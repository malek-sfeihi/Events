<div class="auth auth-split">
  <a routerLink="/" class="auth-back">← align.</a>

  <div class="auth-split-inner motion-fade">
    <aside class="auth-side auth-side--register">
      <img src="/images/landing/auth-register.jpg" alt="" width="900" height="1200" />
      <p class="auth-side-caption">Créer ton cadre.</p>
    </aside>

    <div class="auth-card-wrap">
      <div class="auth-card auth-card-wide">
        <h1 class="auth-title">Créer un compte</h1>
        <p class="auth-hint">Choisissez votre rôle.</p>

        @if (error()) {
          <p class="auth-error" role="alert">{{ error() }}</p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label class="field">
            <span>Nom complet</span>
            <input type="text" formControlName="fullName" autocomplete="name" />
          </label>
          <label class="field">
            <span>Email</span>
            <input type="email" formControlName="email" autocomplete="email" />
          </label>
          <label class="field">
            <span>Mot de passe</span>
            <input type="password" formControlName="password" autocomplete="new-password" />
          </label>
          <label class="field">
            <span>Photo de profil (optionnel)</span>
            <input type="file" accept="image/*" (change)="onPhotoSelected($event)" />
          </label>

          <fieldset class="role-field">
            <legend>Je suis</legend>
            <div class="role-row">
              @for (r of roles; track r.value) {
                <label class="role-pill">
                  <input type="radio" formControlName="role" [value]="r.value" />
                  <span>{{ r.label }}</span>
                </label>
              }
            </div>
          </fieldset>

          <button type="submit" class="btn btn-accent btn-block">Continuer</button>
        </form>

        <p class="auth-alt">
          Déjà inscrit ?
          <a routerLink="/login">Connexion</a>
        </p>
      </div>
    </div>
  </div>
</div>
