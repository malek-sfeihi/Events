<div class="auth auth-split">
  <a routerLink="/" class="auth-back">← EventSpace</a>

  <div class="auth-split-inner motion-fade">
    <aside class="auth-side auth-side--register">
      <img src="/images/landing/auth-register.jpg" alt="" width="900" height="1200" loading="eager" />
      <p class="auth-side-caption">Rejoignez la plateforme.</p>
    </aside>

    <div class="auth-card-wrap">
      <div class="auth-card auth-card-wide">
        <h1 class="auth-title">Créer un compte</h1>
        <p class="auth-hint">Remplissez le formulaire et choisissez votre rôle.</p>

        @if (error()) {
          <p class="auth-error" role="alert">{{ error() }}</p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <!-- Nom complet -->
          <label class="field">
            <span>Nom complet</span>
            <input
              type="text"
              formControlName="fullName"
              autocomplete="name"
              [class.field-input-error]="form.controls.fullName.invalid && form.controls.fullName.touched"
            />
            @if (form.controls.fullName.errors?.['required'] && form.controls.fullName.touched) {
              <span class="field-error">Le nom complet est requis.</span>
            } @else if (form.controls.fullName.errors?.['minlength'] && form.controls.fullName.touched) {
              <span class="field-error">Minimum 2 caractères.</span>
            }
          </label>

          <!-- Email -->
          <label class="field">
            <span>Adresse email</span>
            <input
              type="email"
              formControlName="email"
              autocomplete="email"
              [class.field-input-error]="form.controls.email.invalid && form.controls.email.touched"
            />
            @if (form.controls.email.errors?.['required'] && form.controls.email.touched) {
              <span class="field-error">L'email est requis.</span>
            } @else if (form.controls.email.errors?.['email'] && form.controls.email.touched) {
              <span class="field-error">Format d'email invalide.</span>
            }
          </label>

          <!-- Mot de passe -->
          <label class="field">
            <span>Mot de passe</span>
            <input
              type="password"
              formControlName="password"
              autocomplete="new-password"
              [class.field-input-error]="form.controls.password.invalid && form.controls.password.touched"
            />
            @if (form.controls.password.errors?.['required'] && form.controls.password.touched) {
              <span class="field-error">Le mot de passe est requis.</span>
            } @else if (form.controls.password.errors?.['minlength'] && form.controls.password.touched) {
              <span class="field-error">Minimum 6 caractères.</span>
            }
          </label>

          <!-- Photo (optionnel) -->
          <label class="field">
            <span>Photo de profil <span style="font-weight:400;text-transform:none">(optionnel · max 5 Mo)</span></span>
            <input type="file" accept="image/jpeg,image/png,image/webp" (change)="onPhotoSelected($event)" />
            @if (photoError) {
              <span class="field-error">{{ photoError }}</span>
            }
          </label>

          <!-- Rôle -->
          <fieldset class="role-field">
            <legend>Je suis</legend>
            <div class="role-row">
              @for (r of roles; track r.value) {
                <label class="role-pill">
                  <input type="radio" formControlName="role" [value]="r.value" />
                  <span>{{ r.label }}</span>
                </label>
              }
            </div>
          </fieldset>

          <button type="submit" class="btn btn-accent btn-block btn-lg">
            Créer mon compte
          </button>
        </form>

        <p class="auth-alt">
          Déjà inscrit ?
          <a routerLink="/login">Se connecter</a>
        </p>
      </div>
    </div>
  </div>
</div>
