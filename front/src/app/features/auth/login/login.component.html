<div class="auth auth-split">
  <a routerLink="/" class="auth-back">← align.</a>

  <div class="auth-split-inner motion-fade">
    <aside class="auth-side auth-side--login">
      <img src="/images/landing/auth-login.jpg" alt="" width="900" height="1200" />
      <p class="auth-side-caption">Rentrer dans le fil.</p>
    </aside>

    <div class="auth-card-wrap">
      <div class="auth-card">
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-hint">Accédez à votre espace.</p>

        @if (error()) {
          <p class="auth-error" role="alert">{{ error() }}</p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label class="field">
            <span>Email</span>
            <input
              type="email"
              formControlName="email"
              autocomplete="email"
              [class.field-input-error]="form.controls.email.invalid && form.controls.email.touched"
            />
            @if (form.controls.email.errors?.['required'] && form.controls.email.touched) {
              <span class="field-error">L'email est requis.</span>
            } @else if (form.controls.email.errors?.['email'] && form.controls.email.touched) {
              <span class="field-error">Adresse email invalide.</span>
            }
          </label>
          <label class="field">
            <span>Mot de passe</span>
            <input
              type="password"
              formControlName="password"
              autocomplete="current-password"
              [class.field-input-error]="form.controls.password.invalid && form.controls.password.touched"
            />
            @if (form.controls.password.errors?.['required'] && form.controls.password.touched) {
              <span class="field-error">Le mot de passe est requis.</span>
            } @else if (form.controls.password.errors?.['minlength'] && form.controls.password.touched) {
              <span class="field-error">Minimum 6 caractères.</span>
            }
          </label>
          <button type="submit" class="btn btn-accent btn-block">Entrer</button>
        </form>

        <p class="auth-alt">
          Pas encore de compte ?
          <a routerLink="/register">Créer un compte</a>
        </p>
      </div>
    </div>
  </div>
</div>
