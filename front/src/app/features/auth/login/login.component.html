<div class="auth auth-split">
  <a routerLink="/" class="auth-back">← align.</a>

  <div class="auth-split-inner motion-fade">
    <aside class="auth-side auth-side--login">
      <img src="/images/landing/auth-login.jpg" alt="" width="900" height="1200" />
      <p class="auth-side-caption">Rentrer dans le fil.</p>
    </aside>

    <div class="auth-card-wrap">
      <div class="auth-card">
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-hint">Accédez à votre espace.</p>

        @if (error()) {
          <p class="auth-error" role="alert">{{ error() }}</p>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label class="field">
            <span>Email</span>
            <input type="email" formControlName="email" autocomplete="email" />
          </label>
          <label class="field">
            <span>Mot de passe</span>
            <input type="password" formControlName="password" autocomplete="current-password" />
          </label>
          <button type="submit" class="btn btn-accent btn-block">Entrer</button>
        </form>

        <p class="auth-alt">
          Pas encore de compte ?
          <a routerLink="/register">Créer un compte</a>
        </p>
      </div>
    </div>
  </div>
</div>
