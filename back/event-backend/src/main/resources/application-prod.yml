spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

recommendation:
  python:
    enabled: true
    base-url: ${AI_SERVICE_URL}
    score-path: /api/v1/recommendations/score

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:*,http://127.0.0.1:*}
